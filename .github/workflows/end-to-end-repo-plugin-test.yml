name: Build and test S3Repo Munki plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  end-to-end-repo-plugin-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v4

      # Split restore/save (rather than the combined action) so save can run
      # right after the build step, regardless of later step failures - the
      # combined action's save only runs when the whole job succeeds (post-if: success()).
      - name: Restore SwiftPM dependencies
        id: cache-spm
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install and verify swiftpkg
        run: |
          ./scripts/install-swiftpkg.sh --install

      - name: Install munkitools
        run: |
          ./scripts/install-munkitools.sh --install

      - name: Install rustfs
        run: |
          ./scripts/install-rustfs.sh --install

      - name: Install AWS CLI
        run: |
          ./scripts/install-awscli.sh

      - name: Build S3Repo plugin package
        run: |
          ./scripts/build-plugin-package.sh

      - name: Save SwiftPM dependencies
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.cache-spm.outputs.cache-primary-key }}

      - name: Install S3Repo Munki repo plugin package
        run: |
          sudo ./scripts/install-plugin-package.sh

      - name: Start rustfs S3 server
        run: |
          RUSTFS_PID=$(./scripts/start-rustfs.sh)
          echo "RUSTFS_PID=$RUSTFS_PID" >> $GITHUB_ENV
          # Give the server time to stabilize
          sleep 2

      - name: Create S3 bucket for munki repository
        run: |
          ./scripts/setup-s3-repo.sh \
            --bucket "munki-repo" \
            --endpoint "http://localhost:9000" \
            --region "us-east-1"

      - name: Run munkiimport end-to-end test
        run: |
          ./scripts/test_munkiimport.sh \
            --repo-url "http://localhost:9000/munki-repo" \
            --plugin "S3Repo"

      - name: Cleanup
        if: always()
        run: |
          if [ -n "$RUSTFS_PID" ]; then
            kill $RUSTFS_PID 2>/dev/null || true
            wait $RUSTFS_PID 2>/dev/null || true
          fi
